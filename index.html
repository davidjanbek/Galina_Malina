<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Калькулятор параметров торта</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-color: #2d3436;
            --accent-color: #d63031;
            --border-color: #dfe6e9;
            --error-bg: #ffeaa7;
            --error-border: #fdcb6e;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }
        .container {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            max-width: 420px;
            margin: 0 auto;
        }
        h2 { margin-top: 0; font-size: 20px; text-align: center; color: #2d3436; }
        
        .upload-area {
            border: 2px dashed #b2bec3;
            border-radius: 12px;
            padding: 14px;
            text-align: center;
            background: #fafafa;
            cursor: pointer;
            margin-bottom: 14px;
        }
        .upload-area img {
            max-width: 100%;
            max-height: 160px;
            border-radius: 8px;
            display: none;
            margin-top: 8px;
        }
        
        .form-row {
            display: flex;
            gap: 10px;
        }
        .form-group {
            margin-bottom: 12px;
            flex: 1;
        }
        label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; color: #636e72; }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            background: #fff;
        }
        
        .btn-calc {
            width: 100%;
            padding: 14px;
            background: var(--accent-color);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
        }

        .error-card {
            display: none;
            margin-top: 14px;
            padding: 12px 14px;
            background: var(--error-bg);
            border: 1px solid var(--error-border);
            border-radius: 10px;
            font-size: 13px;
            color: #d63031;
            font-weight: 600;
        }

        .result-card {
            display: none;
            margin-top: 16px;
            padding: 16px;
            background: #fff0f0;
            border: 1px solid #ffbebe;
            border-radius: 12px;
            font-size: 13.5px;
            line-height: 1.6;
            color: #2d3436;
        }

        .btn-copy {
            display: none;
            width: 100%;
            padding: 12px;
            background: #2d3436;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🎂 Расчет параметров торта</h2>
        
        <div class="upload-area" onclick="document.getElementById('file-input').click()">
            <span id="upload-label">📸 Прикрепить фото эскиза / референса</span>
            <img id="preview" alt="Эскиз">
            <input type="file" id="file-input" accept="image/*" style="display:none" onchange="handleFileSelect(this)">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Верхний ярус (Ø см): *</label>
                <input type="number" id="top_d" placeholder="например 15" min="5" max="100">
            </div>
            <div class="form-group">
                <label>Ярусов (шт): *</label>
                <input type="number" id="tiers" placeholder="например 3" min="1" max="20">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Шаг ярусов (см):</label>
                <input type="number" id="step" value="5" min="2" max="15">
            </div>
            <div class="form-group">
                <label>Высота яруса (см):</label>
                <input type="number" id="height" value="12" min="5" max="25">
            </div>
        </div>

        <div class="form-group">
            <label>Плотность / тип начинки:</label>
            <select id="density">
                <option value="0.00048">Муссовая / легкая (~0.5 кг/л)</option>
                <option value="0.00065" selected>Стандартная бисквитная (~0.65 кг/л)</option>
                <option value="0.00085">Плотная (Сникерс, орехи, карамель)</option>
                <option value="0.00100">Тяжелая (ганаш, мастичный декор)</option>
            </select>
        </div>

        <div class="form-group">
            <label>Желаемый вес от клиента (кг, необязательно):</label>
            <input type="number" id="target_weight" step="0.1" placeholder="например: 6.5">
        </div>

        <div class="form-group">
            <label>Пожелания по декору и деталям:</label>
            <input type="text" id="notes" placeholder="например: фигурка, корона, живые цветы">
        </div>

        <button class="btn-calc" onclick="calculateCake()">Сформировать расчет</button>

        <div id="error-box" class="error-card"></div>
        <div id="result" class="result-card"></div>
        <button id="copy-btn" class="btn-copy" onclick="copyResult()">📋 Скопировать спецификацию</button>
    </div>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        function handleFileSelect(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.getElementById('preview');
                    img.src = e.target.result;
                    img.style.display = 'block';
                    document.getElementById('upload-label').innerText = '✅ Фото прикреплено';
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function calculateCake() {
            const errorBox = document.getElementById('error-box');
            const resultBox = document.getElementById('result');
            const copyBtn = document.getElementById('copy-btn');

            errorBox.style.display = 'none';
            resultBox.style.display = 'none';
            copyBtn.style.display = 'none';

            // Считывание значений
            const topDInput = document.getElementById('top_d').value;
            const tiersInput = document.getElementById('tiers').value;

            // Валидация: проверка обязательных данных
            let missingFields = [];
            if (!topDInput || parseFloat(topDInput) <= 0) missingFields.push('Диаметр верхнего яруса');
            if (!tiersInput || parseInt(tiersInput) <= 0) missingFields.push('Количество ярусов');

            if (missingFields.length > 0) {
                errorBox.innerHTML = '⚠️ <b>Недостаточно данных для расчета!</b><br>Пожалуйста, укажите: ' + missingFields.join(', ') + '.';
                errorBox.style.display = 'block';
                return;
            }

            const topD = parseFloat(topDInput);
            const tiersCount = parseInt(tiersInput);
            const stepD = parseFloat(document.getElementById('step').value) || 5;
            const tierH = parseFloat(document.getElementById('height').value) || 12;
            const densitySelect = document.getElementById('density');
            const densityValue = parseFloat(densitySelect.value);
            const densityName = densitySelect.options[densitySelect.selectedIndex].text.split(' (')[0];
            const targetWeight = parseFloat(document.getElementById('target_weight').value);
            const notes = document.getElementById('notes').value.trim() || 'По эскизу заказчика';

            let tiersList = [];
            let totalHeight = 0;
            let approxWeight = 0;
            let lastD = topD;

            for (let i = 1; i <= tiersCount; i++) {
                let currentD = topD + (i - 1) * stepD;
                tiersList.push(`• ${i}-й ярус: <b>Ø ${currentD} см</b> × ${tierH} см`);
                totalHeight += tierH;
                
                // Объём цилиндра = π * r² * h
                let volume = Math.PI * Math.pow(currentD / 2, 2) * tierH;
                approxWeight += volume * densityValue;
                lastD = currentD;
            }

            const substrateD = lastD + 6;
            const axisH = totalHeight + 8;
            const finalWeightStr = approxWeight.toFixed(1);

            let specHtml = `<b>📋 СПЕЦИФИКАЦИЯ РАСЧЕТА ТОРТА</b><br>`;
            specHtml += `───────────────────────────<br>`;
            specHtml += `🎂 <b>Ярусов:</b> ${tiersCount}<br>`;
            specHtml += `🍰 <b>Тип начинки:</b> ${densityName}<br>`;
            specHtml += `📏 <b>Верхний диаметр:</b> Ø ${topD} см<br><br>`;
            specHtml += `📐 <b>РАСЧЕТ ЯРУСОВ (Диаметр × Высота):</b><br>`;
            specHtml += tiersList.join('<br>') + `<br><br>`;
            specHtml += `🛠 <b>КОНСТРУКТИВ И СБОРКА:</b><br>`;
            specHtml += `• Подложка: <b>Ø ${substrateD} см</b><br>`;
            specHtml += `• Высота конструкции: <b>${totalHeight} см</b><br>`;
            specHtml += `• Центральная ось: <b>${axisH} см</b><br>`;
            specHtml += `• Ориентировочный вес: <b>~${finalWeightStr} кг</b><br>`;

            // Проверка и сравнение с желаемым весом от клиента
            if (!isNaN(targetWeight) && targetWeight > 0) {
                const diff = Math.abs(approxWeight - targetWeight).toFixed(1);
                specHtml += `<br>🎯 <b>Заявленный вес клиентом:</b> ${targetWeight} кг<br>`;
                if (Math.abs(approxWeight - targetWeight) > 1.0) {
                    specHtml += `⚠️ <i>Внимание: расхождение с конструктивным весом ~${diff} кг! Поправьте диаметры или высоту.</i><br>`;
                } else {
                    specHtml += `✅ <i>Размеры полностью соответствуют заявленному весу.</i><br>`;
                }
            }

            specHtml += `<br>💬 <b>Декор и примечания:</b> ${notes}<br>`;
            specHtml += `───────────────────────────<br>`;
            specHtml += `<i>Сформировано автоматически</i>`;

            resultBox.innerHTML = specHtml;
            resultBox.style.display = 'block';
            copyBtn.style.display = 'block';
        }

        function copyResult() {
            const container = document.getElementById('result');
            const textToCopy = container.innerText;
            navigator.clipboard.writeText(textToCopy).then(() => {
                alert('Спецификация скопирована в буфер обмена!');
            });
        }
    </script>
</body>
</html>
