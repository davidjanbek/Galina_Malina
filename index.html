<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Калькулятор параметров торта</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-color: #2d3436;
            --accent-color: #d63031;
            --border-color: #dfe6e9;
            --error-bg: #ffeaa7;
            --error-border: #fdcb6e;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }
        .container {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            max-width: 420px;
            margin: 0 auto;
        }
        h2 { margin-top: 0; font-size: 20px; text-align: center; color: #2d3436; }
        
        .form-row {
            display: flex;
            gap: 10px;
        }
        .form-group {
            margin-bottom: 12px;
            flex: 1;
        }
        label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; color: #636e72; }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            background: #fff;
        }
        
        .btn-calc {
            width: 100%;
            padding: 14px;
            background: var(--accent-color);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
        }

        .error-card {
            display: none;
            margin-top: 14px;
            padding: 12px 14px;
            background: var(--error-bg);
            border: 1px solid var(--error-border);
            border-radius: 10px;
            font-size: 13px;
            color: #d63031;
            font-weight: 600;
        }

        .result-card {
            display: none;
            margin-top: 16px;
            padding: 16px;
            background: #fff0f0;
            border: 1px solid #ffbebe;
            border-radius: 12px;
            font-size: 13.5px;
            line-height: 1.6;
            color: #2d3436;
        }

        .btn-copy {
            display: none;
            width: 100%;
            padding: 12px;
            background: #2d3436;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🎂 Расчет параметров торта</h2>

        <div class="form-row">
            <div class="form-group">
                <label>Верхний ярус (Ø см): *</label>
                <input type="number" id="top_d" placeholder="например 15" min="5" max="100">
            </div>
            <div class="form-group">
                <label>Ярусов (шт): *</label>
                <input type="number" id="tiers" placeholder="например 3" min="1" max="20">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Шаг ярусов (см):</label>
                <input type="number" id="step" value="5" min="1" max="15">
            </div>
            <div class="form-group">
                <label>Высота яруса (см):</label>
                <input type="number" id="height" value="12" min="5" max="25">
            </div>
        </div>

        <div class="form-group">
            <label>Плотность начинки (кг/л): *</label>
            <input type="number" id="density" step="0.01" value="0.65" placeholder="например 0.65 или 0.85">
        </div>

        <div class="form-group">
            <label>Желаемый вес от клиента (кг, необязательно):</label>
            <input type="number" id="target_weight" step="0.1" placeholder="например 6.5">
        </div>

        <button class="btn-calc" onclick="calculateCake()">Сформировать расчет</button>

        <div id="error-box" class="error-card"></div>
        <div id="result" class="result-card"></div>
        <button id="copy-btn" class="btn-copy" onclick="copyResult()">📋 Скопировать спецификацию</button>
    </div>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        function calculateCake() {
            const errorBox = document.getElementById('error-box');
            const resultBox = document.getElementById('result');
            const copyBtn = document.getElementById('copy-btn');

            errorBox.style.display = 'none';
            resultBox.style.display = 'none';
            copyBtn.style.display = 'none';

            // Считывание значений
            const topDInput = document.getElementById('top_d').value;
            const tiersInput = document.getElementById('tiers').value;
            const densityInput = document.getElementById('density').value;

            // Валидация обязательных данных
            let missingFields = [];
            if (!topDInput || parseFloat(topDInput) <= 0) missingFields.push('Диаметр верхнего яруса');
            if (!tiersInput || parseInt(tiersInput) <= 0) missingFields.push('Количество ярусов');
            if (!densityInput || parseFloat(densityInput) <= 0) missingFields.push('Плотность начинки (кг/л)');

            if (missingFields.length > 0) {
                errorBox.innerHTML = '⚠️ <b>Недостаточно данных для расчета!</b><br>Заполните обязательные поля: ' + missingFields.join(', ') + '.';
                errorBox.style.display = 'block';
                return;
            }

            const topD = parseFloat(topDInput);
            const tiersCount = parseInt(tiersInput);
            const stepD = parseFloat(document.getElementById('step').value) || 5;
            const tierH = parseFloat(document.getElementById('height').value) || 12;
            const densityKgL = parseFloat(densityInput);
            const targetWeight = parseFloat(document.getElementById('target_weight').value);

            let tiersList = [];
            let totalHeight = 0;
            let approxWeight = 0;
            let lastD = topD;

            for (let i = 1; i <= tiersCount; i++) {
                let currentD = topD + (i - 1) * stepD;
                tiersList.push(`• ${i}-й ярус: <b>Ø ${currentD} см</b> × ${tierH} см`);
                totalHeight += tierH;
                
                // Объём цилиндра в см³ = π * r² * h
                let volumeCm3 = Math.PI * Math.pow(currentD / 2, 2) * tierH;
                // Объём в литрах = volumeCm3 / 1000
                // Вес (кг) = Объём (л) * Плотность (кг/л)
                approxWeight += (volumeCm3 / 1000) * densityKgL;
                lastD = currentD;
            }

            const substrateD = lastD + 6;
            const axisH = totalHeight + 8;
            const finalWeightStr = approxWeight.toFixed(1);

            let specHtml = `<b>📋 СПЕЦИФИКАЦИЯ РАСЧЕТА ТОРТА</b><br>`;
            specHtml += `───────────────────────────<br>`;
            specHtml += `🎂 <b>Ярусов:</b> ${tiersCount}<br>`;
            specHtml += `⚖️ <b>Плотность начинки:</b> ${densityKgL} кг/л<br>`;
            specHtml += `📏 <b>Верхний диаметр:</b> Ø ${topD} см<br><br>`;
            specHtml += `📐 <b>РАСЧЕТ ЯРУСОВ (Диаметр × Высота):</b><br>`;
            specHtml += tiersList.join('<br>') + `<br><br>`;
            specHtml += `🛠 <b>КОНСТРУКТИВ И СБОРКА:</b><br>`;
            specHtml += `• Подложка: <b>Ø ${substrateD} см</b><br>`;
            specHtml += `• Высота конструкции: <b>${totalHeight} см</b><br>`;
            specHtml += `• Центральная ось: <b>${axisH} см</b><br>`;
            specHtml += `• Ориентировочный вес: <b>~${finalWeightStr} кг</b><br>`;

            // Сравнение с желаемым весом от клиента
            if (!isNaN(targetWeight) && targetWeight > 0) {
                const diff = Math.abs(approxWeight - targetWeight).toFixed(1);
                specHtml += `<br>🎯 <b>Заявленный вес клиентом:</b> ${targetWeight} кг<br>`;
                if (Math.abs(approxWeight - targetWeight) > 0.8) {
                    specHtml += `⚠️ <i>Внимание: расхождение с конструктивным весом ~${diff} кг! Скорректируйте диаметры или высоту.</i><br>`;
                } else {
                    specHtml += `✅ <i>Размеры полностью соответствуют заявленному весу.</i><br>`;
                }
            }

            specHtml += `───────────────────────────<br>`;
            specHtml += `<i>Сформировано автоматически</i>`;

            resultBox.innerHTML = specHtml;
            resultBox.style.display = 'block';
            copyBtn.style.display = 'block';
        }

        function copyResult() {
            const container = document.getElementById('result');
            const textToCopy = container.innerText;
            navigator.clipboard.writeText(textToCopy).then(() => {
                alert('Спецификация скопирована в буфер обмена!');
            });
        }
    </script>
</body>
</html>
