<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Калькулятор параметров торта</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-color: #2d3436;
            --accent-color: #d63031;
            --border-color: #dfe6e9;
            --error-bg: #ffeaa7;
            --error-border: #fdcb6e;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }
        .container {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            max-width: 440px;
            margin: 0 auto;
        }
        h2 { margin-top: 0; font-size: 20px; text-align: center; color: #2d3436; margin-bottom: 16px; }

        .shape-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            background: #f1f2f6;
            padding: 4px;
            border-radius: 10px;
        }
        .shape-btn {
            flex: 1;
            padding: 9px;
            border: none;
            background: transparent;
            font-size: 13.5px;
            font-weight: 700;
            color: #57606f;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .shape-btn.active {
            background: #ffffff;
            color: var(--accent-color);
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }
        
        .form-row {
            display: flex;
            gap: 10px;
        }
        .form-group {
            margin-bottom: 12px;
            flex: 1;
        }
        label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; color: #636e72; }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            background: #fff;
        }

        .btn-toggle-tiers {
            background: #f1f2f6;
            border: 1px solid #ced6e0;
            color: #2f3542;
            padding: 9px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin: 6px 0 14px 0;
            text-align: center;
        }

        .tiers-table-container {
            display: none;
            background: #fafafa;
            border: 1px solid #e4e7eb;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 14px;
        }
        .tiers-table-title {
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #2f3542;
        }

        .tier-header-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
            font-size: 11px;
            font-weight: 700;
            color: #636e72;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .th-label { width: 105px; }
        .th-col { flex: 1; text-align: center; }
        .th-spacer { width: 14px; }

        .tier-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        .tier-row span.tier-num {
            font-size: 12px;
            font-weight: 600;
            width: 105px;
            color: #57606f;
        }
        .tier-row input {
            flex: 1;
            padding: 8px;
            font-size: 13px;
            text-align: center;
        }
        .tier-row span.tier-sep {
            width: 14px;
            text-align: center;
            font-size: 13px;
            color: #a4b0be;
            font-weight: bold;
        }
        
        .btn-calc {
            width: 100%;
            padding: 14px;
            background: var(--accent-color);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 6px;
        }

        .error-card {
            display: none;
            margin-top: 14px;
            padding: 12px 14px;
            background: var(--error-bg);
            border: 1px solid var(--error-border);
            border-radius: 10px;
            font-size: 13px;
            color: #d63031;
            font-weight: 600;
        }

        .result-card {
            display: none;
            margin-top: 16px;
            padding: 16px;
            background: #fff0f0;
            border: 1px solid #ffbebe;
            border-radius: 12px;
            font-size: 13.5px;
            line-height: 1.6;
            color: #2d3436;
        }

        .btn-copy {
            display: none;
            width: 100%;
            padding: 13px;
            background: #2d3436;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
            text-align: center;
        }
        .btn-copy:active {
            background: #1e272e;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🎂 Расчет параметров торта</h2>

        <!-- Форма торта -->
        <div class="shape-selector">
            <button type="button" id="btn-shape-round" class="shape-btn active" onclick="setShape('round')">🟡 Круглый</button>
            <button type="button" id="btn-shape-square" class="shape-btn" onclick="setShape('square')">◽ Квадратный</button>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Ярусов (шт): *</label>
                <input type="number" id="tiers" placeholder="например 3" value="3" min="1" max="15">
            </div>
            <div class="form-group">
                <label id="lbl-base-size">1-й ярус (нижний, Ø см): *</label>
                <input type="number" id="base_size" placeholder="например 20" value="20" min="5" max="120">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Шаг ширины к верху (см):</label>
                <input type="number" id="step_size" value="4" min="0" max="30" title="На сколько см каждый следующий ярус уже">
            </div>
            <div class="form-group">
                <label>Высота 1-го яруса (см): *</label>
                <input type="number" id="base_height" value="19" min="5" max="40">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Уменьшение высоты к верху (см):</label>
                <input type="number" id="step_height" value="3" min="0" max="15" placeholder="0 = одинаковая">
            </div>
            <div class="form-group">
                <label>Плотность (кг/л): *</label>
                <input type="number" id="density" step="0.01" value="0.76" placeholder="0.76">
            </div>
        </div>

        <button type="button" class="btn-toggle-tiers" onclick="toggleTiersTable()">⚙️ Настроить параметры каждого яруса вручную</button>

        <div id="tiers-table-container" class="tiers-table-container">
            <div class="tiers-table-title">Индивидуальные параметры (снизу вверх):</div>
            
            <div class="tier-header-row">
                <span class="th-label">Ярус</span>
                <span id="th-size-label" class="th-col">Диаметр (см)</span>
                <span class="th-spacer"></span>
                <span class="th-col">Высота (см)</span>
            </div>

            <div id="tiers-inputs-list"></div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Запас на декор (%):</label>
                <input type="number" id="decor_percent" value="20" min="0" max="100" placeholder="например 20 или 35">
            </div>
            <div class="form-group">
                <label>Желаемый вес (кг, необязательно):</label>
                <input type="number" id="target_weight" step="0.1" placeholder="например 10.0">
            </div>
        </div>

        <button class="btn-calc" onclick="calculateCake()">Сформировать расчет</button>

        <div id="error-box" class="error-card"></div>
        <div id="result" class="result-card"></div>
        
        <button id="copy-btn" class="btn-copy" onclick="copyResult()">📋 Скопировать расчёт</button>
    </div>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        let currentShape = 'round';
        let isCustomTableOpen = false;

        function setShape(shape) {
            currentShape = shape;
            const btnRound = document.getElementById('btn-shape-round');
            const btnSquare = document.getElementById('btn-shape-square');
            const lblBaseSize = document.getElementById('lbl-base-size');
            const thSizeLabel = document.getElementById('th-size-label');

            if (shape === 'round') {
                btnRound.classList.add('active');
                btnSquare.classList.remove('active');
                lblBaseSize.innerText = '1-й ярус (нижний, Ø см): *';
                thSizeLabel.innerText = 'Диаметр (см)';
            } else {
                btnSquare.classList.add('active');
                btnRound.classList.remove('active');
                lblBaseSize.innerText = '1-й ярус (нижний, сторона см): *';
                thSizeLabel.innerText = 'Сторона (см)';
            }
            if (isCustomTableOpen) {
                renderTiersInputs();
            }
        }

        function toggleTiersTable() {
            const container = document.getElementById('tiers-table-container');
            isCustomTableOpen = !isCustomTableOpen;
            container.style.display = isCustomTableOpen ? 'block' : 'none';
            if (isCustomTableOpen) {
                renderTiersInputs();
            }
        }

        function renderTiersInputs() {
            const tiersCount = parseInt(document.getElementById('tiers').value) || 3;
            const baseSize = parseFloat(document.getElementById('base_size').value) || 20;
            const stepSize = parseFloat(document.getElementById('step_size').value) || 0;
            const baseHeight = parseFloat(document.getElementById('base_height').value) || 19;
            const stepHeight = parseFloat(document.getElementById('step_height').value) || 0;
            const listDiv = document.getElementById('tiers-inputs-list');

            const sizePlaceholder = currentShape === 'round' ? 'Ø см' : 'см';

            let html = '';
            for (let i = 1; i <= tiersCount; i++) {
                const autoSize = Math.max(5, baseSize - (i - 1) * stepSize);
                const autoH = Math.max(4, baseHeight - (i - 1) * stepHeight);

                let tierLabel = `${i}-й ярус`;
                if (i === 1) tierLabel += ' (низ):';
                else if (i === tiersCount) tierLabel += ' (верх):';
                else tierLabel += ':';

                html += `
                <div class="tier-row">
                    <span class="tier-num">${tierLabel}</span>
                    <input type="number" id="tier_size_${i}" value="${autoSize}" placeholder="${sizePlaceholder}">
                    <span class="tier-sep">×</span>
                    <input type="number" id="tier_h_${i}" value="${autoH}" placeholder="h см">
                </div>`;
            }
            listDiv.innerHTML = html;
        }

        function calculateCake() {
            const errorBox = document.getElementById('error-box');
            const resultBox = document.getElementById('result');
            const copyBtn = document.getElementById('copy-btn');

            errorBox.style.display = 'none';
            resultBox.style.display = 'none';
            copyBtn.style.display = 'none';

            const tiersCount = parseInt(document.getElementById('tiers').value);
            const baseSize = parseFloat(document.getElementById('base_size').value);
            const baseHeight = parseFloat(document.getElementById('base_height').value);
            const stepSize = parseFloat(document.getElementById('step_size').value) || 0;
            const stepHeight = parseFloat(document.getElementById('step_height').value) || 0;
            const densityKgL = parseFloat(document.getElementById('density').value);
            const decorPercent = parseFloat(document.getElementById('decor_percent').value) || 0;
            const targetWeight = parseFloat(document.getElementById('target_weight').value);

            let missing = [];
            if (!tiersCount || tiersCount <= 0) missing.push('Количество ярусов');
            if (!baseSize || baseSize <= 0) missing.push(currentShape === 'round' ? 'Диаметр 1-го яруса' : 'Сторона 1-го яруса');
            if (!baseHeight || baseHeight <= 0) missing.push('Высота 1-го яруса');
            if (!densityKgL || densityKgL <= 0) missing.push('Плотность начинки (кг/л)');

            if (missing.length > 0) {
                errorBox.innerHTML = '⚠️ <b>Недостаточно данных!</b><br>Заполните: ' + missing.join(', ') + '.';
                errorBox.style.display = 'block';
                return;
            }

            let tiersList = [];
            let totalHeight = 0;
            let pureCakeWeight = 0;
            let bottomTierSize = 0;

            for (let i = 1; i <= tiersCount; i++) {
                let tierSize = 0;
                let tierH = 0;

                if (isCustomTableOpen && document.getElementById(`tier_size_${i}`) && document.getElementById(`tier_h_${i}`)) {
                    tierSize = parseFloat(document.getElementById(`tier_size_${i}`).value);
                    tierH = parseFloat(document.getElementById(`tier_h_${i}`).value);
                } else {
                    tierSize = Math.max(5, baseSize - (i - 1) * stepSize);
                    tierH = Math.max(4, baseHeight - (i - 1) * stepHeight);
                }

                if (!tierSize || !tierH || tierSize <= 0 || tierH <= 0) {
                    errorBox.innerHTML = `⚠️ <b>Ошибка в параметрах ${i}-го яруса!</b> Проверьте числа.`;
                    errorBox.style.display = 'block';
                    return;
                }

                if (i === 1) bottomTierSize = tierSize;
                totalHeight += tierH;

                let volumeCm3 = 0;
                let tierTag = `${i}-й ярус`;
                if (i === 1) tierTag += ' (низ)';
                else if (i === tiersCount) tierTag += ' (верх)';

                if (currentShape === 'round') {
                    volumeCm3 = Math.PI * Math.pow(tierSize / 2, 2) * tierH;
                    const tierWeight = (volumeCm3 / 1000) * densityKgL;
                    pureCakeWeight += tierWeight;
                    tiersList.push(`• <b>${tierTag}:</b> Ø ${tierSize} см × ${tierH} см <i>(~${tierWeight.toFixed(2)} кг)</i>`);
                } else {
                    volumeCm3 = Math.pow(tierSize, 2) * tierH;
                    const tierWeight = (volumeCm3 / 1000) * densityKgL;
                    pureCakeWeight += tierWeight;
                    tiersList.push(`• <b>${tierTag}:</b> ◽ ${tierSize}×${tierSize} см, h=${tierH} см <i>(~${tierWeight.toFixed(2)} кг)</i>`);
                }
            }

            const substrateSize = bottomTierSize + 6;
            const axisH = totalHeight + 8;
            
            const decorWeight = pureCakeWeight * (decorPercent / 100);
            const totalFinalWeight = pureCakeWeight + decorWeight;

            const shapeTitle = currentShape === 'round' ? 'Круглый (цилиндрический)' : 'Квадратный';

            let specHtml = `<b>📋 СПЕЦИФИКАЦИЯ РАСЧЕТА ТОРТА</b><br>`;
            specHtml += `───────────────────────────<br>`;
            specHtml += `🎂 <b>Форма торта:</b> ${shapeTitle}<br>`;
            specHtml += `🍰 <b>Ярусов:</b> ${tiersCount}<br>`;
            specHtml += `⚖️ <b>Плотность начинки:</b> ${densityKgL} кг/л<br><br>`;
            specHtml += `📐 <b>ЯРУСЫ (Снизу вверх: Размер × Высота | Вес):</b><br>`;
            specHtml += tiersList.join('<br>') + `<br><br>`;
            specHtml += `🛠 <b>КОНСТРУКТИВ И СБОРКА:</b><br>`;
            
            if (currentShape === 'round') {
                specHtml += `• Рекомендуемая подложка: <b>Ø ${substrateSize} см</b><br>`;
            } else {
                specHtml += `• Квадратная подложка: <b>${substrateSize}×${substrateSize} см</b><br>`;
                const diag = Math.round(bottomTierSize * Math.SQRT2 + 6);
                specHtml += `• <i>(или круглая по диагонали: Ø ~${diag} см)</i><br>`;
            }

            specHtml += `• Общая высота конструкции: <b>${totalHeight} см</b><br>`;
            specHtml += `• Центральная ось (длина): <b>${axisH} см</b><br><br>`;
            
            specHtml += `⚖️ <b>РАСЧЕТ ВЕСА:</b><br>`;
            specHtml += `• Чистый вес торта: <b>~${pureCakeWeight.toFixed(2)} кг</b><br>`;
            specHtml += `• Декор и оформление (+${decorPercent}%): <b>~${decorWeight.toFixed(2)} кг</b><br>`;
            specHtml += `• <b>ИТОГОВЫЙ ВЕС С ДЕКОРОМ: ~${totalFinalWeight.toFixed(1)} кг</b><br>`;

            if (!isNaN(targetWeight) && targetWeight > 0) {
                const diff = Math.abs(totalFinalWeight - targetWeight).toFixed(1);
                specHtml += `<br>🎯 <b>Заявленный вес клиентом:</b> ${targetWeight} кг<br>`;
                if (Math.abs(totalFinalWeight - targetWeight) > 0.8) {
                    specHtml += `⚠️ <i>Внимание: расхождение с полным весом ~${diff} кг! Скорректируйте размеры ярусов.</i><br>`;
                } else {
                    specHtml += `✅ <i>Итоговый вес с декором отлично попадает в заявку клиента.</i><br>`;
                }
            }

            specHtml += `───────────────────────────<br>`;
            specHtml += `<i>Сформировано в калькуляторе @Galina_Malina_Cakebot</i>`;

            resultBox.innerHTML = specHtml;
            resultBox.style.display = 'block';
            copyBtn.style.display = 'block';
        }

        function copyResult() {
            const container = document.getElementById('result');
            const textToCopy = container.innerText;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(textToCopy).then(() => {
                    alert('Расчёт успешно скопирован в буфер обмена!');
                }).catch(() => {
                    fallbackCopy(textToCopy);
                });
            } else {
                fallbackCopy(textToCopy);
            }
        }

        function fallbackCopy(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand("copy");
            document.body.removeChild(textArea);
            alert('Расчёт успешно скопирован в буфер обмена!');
        }
    </script>
</body>
</html>
