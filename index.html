<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Калькулятор Торта</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-color: #2d3436;
            --accent-color: #d63031;
            --border-color: #dfe6e9;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }
        .container {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            max-width: 400px;
            margin: 0 auto;
        }
        h2 { margin-top: 0; font-size: 20px; text-align: center; color: #2d3436; }
        .upload-area {
            border: 2px dashed #b2bec3;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            background: #fafafa;
            cursor: pointer;
            margin-bottom: 14px;
            position: relative;
        }
        .upload-area img {
            max-width: 100%;
            max-height: 180px;
            border-radius: 8px;
            display: none;
            margin-top: 8px;
        }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; color: #636e72; }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            background: #fff;
        }
        .btn-ai {
            width: 100%;
            padding: 14px;
            background: #6c5ce7;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
        }
        .btn-calc {
            width: 100%;
            padding: 12px;
            background: var(--accent-color);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }
        .result-card {
            display: none;
            margin-top: 16px;
            padding: 14px;
            background: #f8f9fa;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.6;
            color: #2d3436;
            white-space: pre-wrap;
        }
        .btn-copy {
            display: none;
            width: 100%;
            padding: 12px;
            background: #2d3436;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }
        .key-box {
            background: #eef2f7;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🎂 AI Калькулятор Торта</h2>
        
        <div class="key-box">
            <label>🔑 Gemini API Key (сохраняется один раз):</label>
            <input type="password" id="api_key" placeholder="Вставьте ваш AI Studio Key" onchange="saveKey(this.value)">
        </div>

        <div class="upload-area" onclick="document.getElementById('file-input').click()">
            <span id="upload-label">📸 Загрузить фото эскиза / торта</span>
            <img id="preview" alt="Предпросмотр">
            <input type="file" id="file-input" accept="image/*" style="display:none" onchange="handleFileSelect(this)">
        </div>

        <div class="form-group">
            <label>Плотность / тип начинки:</label>
            <select id="density">
                <option value="Легкая (мусс, суфле, ягоды)">Легкая (мусс, суфле)</option>
                <option value="Стандартная (бисквит + крем)" selected>Стандартная (бисквит + крем)</option>
                <option value="Плотная (Сникерс, карамель, орехи)">Плотная (Сникерс, карамель)</option>
                <option value="Тяжелая (ганаш, мастичный декор)">Тяжелая (ганаш, мастика)</option>
            </select>
        </div>

        <div class="form-group">
            <label>Известный диаметр верхнего яруса (см):</label>
            <input type="number" id="top_d" value="15">
        </div>

        <button class="btn-ai" id="ai-btn" onclick="analyzeWithAI()">🤖 Проанализировать фото через ИИ</button>

        <div id="result" class="result-card"></div>
        <button id="copy-btn" class="btn-copy" onclick="copyResult()">📋 Скопировать расчет</button>
    </div>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        // Загрузка сохраненного API ключа
        document.getElementById('api_key').value = localStorage.getItem('gemini_api_key') || '';

        function saveKey(val) {
            localStorage.setItem('gemini_api_key', val.trim());
        }

        let selectedBase64 = null;
        let selectedMime = 'image/jpeg';

        function handleFileSelect(input) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                selectedMime = file.type || 'image/jpeg';
                
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.getElementById('preview');
                    img.src = e.target.result;
                    img.style.display = 'block';
                    document.getElementById('upload-label').innerText = '✅ Фото загружено:';
                    
                    // Извлекаем чистый Base64 без префикса data:image/...
                    selectedBase64 = e.target.result.split(',')[1];
                };
                reader.readAsDataURL(file);
            }
        }

        async function analyzeWithAI() {
            const apiKey = document.getElementById('api_key').value.trim();
            if (!apiKey) {
                alert('Пожалуйста, укажите Gemini API Key в поле вверху.');
                return;
            }

            if (!selectedBase64) {
                alert('Пожалуйста, загрузите фото торта для анализа.');
                return;
            }

            const densityName = document.getElementById('density').value;
            const topD = document.getElementById('top_d').value || '15';
            const btn = document.getElementById('ai-btn');
            const resDiv = document.getElementById('result');

            btn.innerText = '⏳ ИИ анализирует фото...';
            btn.disabled = true;

            const promptText = `Ты профессиональный технолог-кондитер. Проанализируй прикрепленное фото торта и составь точную спецификацию.
Учти следующие вводные данные от кондитера:
- Базовый диаметр верхнего яруса: ${topD} см.
- Тип и плотность начинки: ${densityName}.

Выполни визуальный анализ фото и сформируй спецификацию СТРОГО в следующем формате текста (без лишних вступлений):

📋 СПЕЦИФИКАЦИЯ РАСЧЕТА ТОРТА
───────────────────────────
🎂 Ярусов: [число ярусов по фото]
🍰 Начинка: ${densityName}
📏 Верхний диаметр: Ø ${topD} см

📐 РАСЧЕТ ЯРУСОВ (Диаметр × Высота):
• 1-й ярус: Ø ${topD} см × 12 см
• [остальные ярусы с шагом +5 см по диаметру, если торт многоярусный]

🛠 КОНСТРУКТИВ И СБОРКА:
• Подложка: Ø [диаметр нижнего яруса + 6 см] см
• Высота конструкции: [суммарная высота] см
• Центральная ось: [высота + 8 см] см
• Ориентировочный вес: ~[рассчитай реалистичный вес в кг] кг

🎨 АНАЛИЗ ДЕКОРА ПО ФОТО:
• [подробный список элементов декора, фигурок, цветовой гаммы и покрытия, которые ты видишь на картинке]
───────────────────────────
Сформировано автоматически ИИ-ассистентом кондитера`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: promptText },
                                {
                                    inline_data: {
                                        mime_type: selectedMime,
                                        data: selectedBase64
                                    }
                                }
                            ]
                        }]
                    })
                });

                const data = await response.json();

                if (data.error) {
                    throw new Error(data.error.message || 'Ошибка API');
                }

                const aiResponse = data.candidates[0].content.parts[0].text;

                resDiv.innerText = aiResponse;
                resDiv.style.display = 'block';
                document.getElementById('copy-btn').style.display = 'block';

            } catch (err) {
                alert('Ошибка при анализе: ' + err.message);
            } finally {
                btn.innerText = '🤖 Проанализировать фото через ИИ';
                btn.disabled = false;
            }
        }

        function copyResult() {
            const textToCopy = document.getElementById('result').innerText;
            navigator.clipboard.writeText(textToCopy).then(() => {
                alert('Спецификация скопирована!');
            });
        }
    </script>
</body>
</html>
