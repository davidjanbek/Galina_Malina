<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Расчет параметров торта</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-color: #2d3436;
            --accent-color: #d63031;
            --border-color: #dfe6e9;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }
        .container {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            max-width: 400px;
            margin: 0 auto;
        }
        h2 {
            margin-top: 0;
            font-size: 20px;
            text-align: center;
            color: #2d3436;
        }
        .upload-area {
            border: 2px dashed #b2bec3;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            background: #fafafa;
            cursor: pointer;
            margin-bottom: 16px;
        }
        .upload-area span { font-size: 14px; color: #636e72; font-weight: 500; }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 15px;
            box-sizing: border-box;
            background: #fff;
        }
        .btn-calc {
            width: 100%;
            padding: 15px;
            background: var(--accent-color);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
        }
        .result-card {
            display: none;
            margin-top: 20px;
            padding: 16px;
            background: #fff0f0;
            border: 1px solid #ffbebe;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
            color: #2d3436;
        }
        .btn-copy {
            display: none;
            width: 100%;
            padding: 12px;
            background: #2d3436;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🎂 Расчет торта</h2>
        
        <div class="upload-area" onclick="document.getElementById('file-input').click()">
            <span id="upload-label">📸 Загрузить фото эскиза / торта</span>
            <input type="file" id="file-input" accept="image/*" style="display:none" onchange="updateLabel(this)">
        </div>

        <div class="form-group">
            <label>Диаметр верхнего яруса (см):</label>
            <input type="number" id="top_d" value="15" min="5" max="100">
        </div>

        <div class="form-group">
            <label>Количество ярусов (любое):</label>
            <input type="number" id="tiers" value="3" min="1" max="20" placeholder="Укажите количество">
        </div>

        <div class="form-group">
            <label>Шаг увеличения диаметра (см):</label>
            <input type="number" id="step" value="5" min="2" max="15">
        </div>

        <div class="form-group">
            <label>Пожелания по декору и деталям:</label>
            <input type="text" id="notes" placeholder="например: фигурка с короной, ~6.5 кг">
        </div>

        <button class="btn-calc" onclick="calculateCake()">Сформировать расчет</button>

        <div id="result" class="result-card"></div>
        <button id="copy-btn" class="btn-copy" onclick="copyResult()">📋 Скопировать расчет</button>
    </div>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        function updateLabel(input) {
            if (input.files && input.files[0]) {
                document.getElementById('upload-label').innerText = '✅ Выбрано: ' + input.files[0].name;
            }
        }

        function calculateCake() {
            const topD = parseInt(document.getElementById('top_d').value) || 15;
            const tiersCount = parseInt(document.getElementById('tiers').value) || 1;
            const stepD = parseInt(document.getElementById('step').value) || 5;
            const notes = document.getElementById('notes').value || 'По фото заказчика';

            let tiersList = [];
            let totalHeight = 0;
            let approxWeight = 0;
            let lastD = topD;

            for (let i = 1; i <= tiersCount; i++) {
                let currentD = topD + (i - 1) * stepD;
                let currentH = 12;
                tiersList.push(`• ${i}-й ярус: <b>Ø ${currentD} см</b> × ${currentH} см`);
                totalHeight += currentH;
                approxWeight += (Math.PI * Math.pow(currentD / 2, 2) * currentH) * 0.00065;
                lastD = currentD;
            }

            const substrateD = lastD + 6;
            const axisH = totalHeight + 8;
            approxWeight = approxWeight.toFixed(1);

            let specHtml = `<b>📋 СПЕЦИФИКАЦИЯ РАСЧЕТА ТОРТА</b><br>`;
            specHtml += `───────────────────────────<br>`;
            specHtml += `🎂 <b>Ярусов:</b> ${tiersCount}<br>`;
            specHtml += `📏 <b>Верхний диаметр:</b> Ø ${topD} см<br><br>`;
            specHtml += `📐 <b>РАСЧЕТ ЯРУСОВ (Диаметр × Высота):</b><br>`;
            specHtml += tiersList.join('<br>') + `<br><br>`;
            specHtml += `🛠 <b>КОНСТРУКТИВ И СБОРКА:</b><br>`;
            specHtml += `• Подложка: <b>Ø ${substrateD} см</b><br>`;
            specHtml += `• Высота конструкции: <b>${totalHeight} см</b><br>`;
            specHtml += `• Центральная ось: <b>${axisH} см</b><br>`;
            specHtml += `• Ориентировочный вес: <b>~${approxWeight} кг</b><br><br>`;
            specHtml += `💬 <b>Пожелания:</b> ${notes}<br>`;
            specHtml += `───────────────────────────<br>`;
            specHtml += `<i>Сформировано автоматически</i>`;

            const resDiv = document.getElementById('result');
            resDiv.innerHTML = specHtml;
            resDiv.style.display = 'block';

            document.getElementById('copy-btn').style.display = 'block';
        }

        function copyResult() {
            const container = document.getElementById('result');
            const textToCopy = container.innerText;
            navigator.clipboard.writeText(textToCopy).then(() => {
                alert('Спецификация скопирована в буфер обмена!');
            });
        }
    </script>
</body>
</html>
